<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Apply</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="sidepanel">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">JA</span>
      <div>
        <div class="brand-name">Job Apply</div>
      </div>
    </div>
    <div id="status" class="status">checking…</div>
  </header>

  <input type="radio" name="main-tab" id="tab-job" class="tab-input" checked />
  <input type="radio" name="main-tab" id="tab-resume" class="tab-input" />
  <input type="radio" name="main-tab" id="tab-apply" class="tab-input" />

  <p class="workflow-strip" aria-hidden="true">
    <span class="wf-step">1 Job</span>
    <span class="wf-arrow">→</span>
    <span class="wf-step">2 Resume</span>
    <span class="wf-arrow">→</span>
    <span class="wf-step">3 Apply</span>
  </p>

  <nav class="tab-bar" aria-label="Workflow">
    <label for="tab-job" class="tab-label">1 · Job</label>
    <label for="tab-resume" class="tab-label">2 · Resume</label>
    <label for="tab-apply" class="tab-label">3 · Apply</label>
  </nav>

  <main class="app-main tab-panels">
    <!-- 1 · JOB -->
    <section class="tab-panel tab-job" aria-labelledby="tab-job">
      <div id="jobContextPreview" class="job-preview empty" aria-live="polite">
        Company · title — use Extract or type below
      </div>
      <button id="scrapeBtn" type="button" class="primary btn-block">Extract from page (Alt+E)</button>
      <div class="field-stack">
        <div class="field-row-2">
          <div>
            <label for="company">Company</label>
            <input id="company" type="text" placeholder="Acme Corp" />
          </div>
          <div>
            <label for="jobTitle">Job title</label>
            <input id="jobTitle" type="text" placeholder="Senior Engineer" />
          </div>
        </div>
        <div>
          <label for="jobUrl">Job URL</label>
          <input id="jobUrl" type="text" />
        </div>
        <div>
          <label for="jobDescription">Job description</label>
          <textarea id="jobDescription" rows="8" placeholder="Filled by Extract or paste here"></textarea>
        </div>
        <div id="jobFacts" class="job-facts"></div>
      </div>
      <p class="tab-lead">Next: open <strong>2 · Resume</strong> to generate your PDF.</p>
    </section>

    <!-- 2 · RESUME -->
    <section class="tab-panel tab-resume" aria-labelledby="tab-resume">
      <p class="tab-lead">Uses the job from step 1. Template &amp; providers are in <strong>Settings → Generation</strong>.</p>
      <div id="tailorSection">
        <div class="field-stack">
          <button id="generateBtn" type="button" class="primary btn-block">Generate JSON (Alt+G)</button>
          <button id="copyPromptBtn" type="button" class="primary btn-block" style="display: none">Copy prompt for GPT (Alt+G)</button>
          <div id="generateResult" class="result-card"></div>
          <div>
            <label for="resumeJson">Resume JSON</label>
            <textarea id="resumeJson" rows="8" placeholder="From Generate or paste ChatGPT JSON"></textarea>
          </div>
          <button id="renderBtn" type="button" class="primary btn-block" disabled>Generate PDF (Alt+P)</button>
          <div id="result" class="status-line"></div>
        </div>
      </div>
      <div id="nonTailorSection" style="display: none">
        <div class="field-stack">
          <div>
            <label for="resumeSelect">Resume to use</label>
            <select id="resumeSelect"></select>
          </div>
          <div id="resumeSuggestHint" class="hint"></div>
        </div>
      </div>
      <p class="tab-lead">Next: <strong>3 · Apply</strong> — Auto Fill, then attach PDF if needed.</p>
    </section>

    <!-- 3 · APPLY -->
    <section class="tab-panel tab-apply" aria-labelledby="tab-apply">
      <button id="autofillBtn" type="button" class="hero-cta primary">
        <span class="hero-cta-title">Auto Fill</span>
        <span class="hero-cta-sub">Fill this application · Alt+F</span>
      </button>
      <div class="quick-bar" role="toolbar" aria-label="Apply actions">
        <button id="attachResumeBtn" type="button" class="quick-btn" title="Alt+R">Attach PDF</button>
        <button id="learnBtn" type="button" class="quick-btn" title="Alt+L">Learn</button>
        <button id="saveSampleBtn" type="button" class="quick-btn" title="Alt+S">Sample</button>
      </div>
      <div id="autofillResult" class="result-card" aria-live="polite"></div>
      <div id="attachResumeResult" class="status-line"></div>
      <div id="saveSampleResult" class="status-line"></div>

      <details class="fold">
        <summary>Log to portal</summary>
        <div class="field-stack fold-body">
          <div>
            <label for="platformSelect">Platform</label>
            <select id="platformSelect">
              <option value="hiring.cafe">hiring.cafe</option>
              <option value="Greenhouse">Greenhouse</option>
              <option value="Jungle">Jungle</option>
              <option value="remoteyeah.com">remoteyeah.com</option>
              <option value="jobright">jobright</option>
              <option value="Builtin">Builtin</option>
              <option value="ZipRecruiter">ZipRecruiter</option>
              <option value="Indeed">Indeed</option>
              <option value="welcomethejungle.com">welcomethejungle.com</option>
              <option value="pracuj.pl">pracuj.pl</option>
              <option value="weworkremotely.com">weworkremotely.com</option>
              <option value="jobs.workable.com">jobs.workable.com</option>
              <option value="jobgether.com">jobgether.com</option>
              <option value="remoterocketship">remoterocketship</option>
              <option value="justjoin.it">justjoin.it</option>
              <option value="theprotocol.it">theprotocol.it</option>
              <option value="nofluffjob.com">nofluffjob.com</option>
              <option value="glassdoor.com">glassdoor.com</option>
              <option value="linkedin.com" selected>linkedin.com</option>
            </select>
          </div>
          <button id="portalLogBtn" type="button" class="secondary btn-block">Save &amp; sync to portal (Alt+Y)</button>
          <div id="portalLogResult" class="status-line"></div>
        </div>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <button id="settingsBtn" type="button" class="link">Settings (Alt+O)</button>
    <button id="refreshBtn" type="button" class="link" title="Reload settings">↻ Refresh (Alt+U)</button>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
